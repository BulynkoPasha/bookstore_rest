databaseChangeLog:
  - changeSet:
      id: 010-add-audit-log
      author: bookstore
      changes:
        - createTable:
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: BIGINT
              - column:
                  name: entity_title
                  type: VARCHAR(255)
              - column:
                  name: performed_by
                  type: VARCHAR(255)
              - column:
                  name: performed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT